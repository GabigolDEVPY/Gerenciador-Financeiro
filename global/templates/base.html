<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <title>{% block title %}FinControl{% endblock %}</title>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200 flex flex-col">

    <!-- Inclusão da Navbar -->
    {% include "navbar.html" %}

    <!-- Conteúdo Principal -->
    <main class="flex-grow max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Global (Opcional, já que estava dentro do main nos originais) -->
    <footer class="text-center text-xs text-base-content/50 py-6">
        FinControl · Gerenciamento financeiro pessoal
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
