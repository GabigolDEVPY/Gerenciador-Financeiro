
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Registro</title>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
    <main class="card w-full max-w-md bg-base-100 shadow-2xl">
        <div class="card-body p-8 sm:p-10">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold">Criar conta</h1>
                <p class="text-base-content/60 mt-2">Preencha os dados para começar.</p>
            </div>
            <form action="/account/api/auth/register/" method="POST" class="space-y-5">
                <div>
                    <label for="username" class="label mb-1"><span class="label-text font-semibold">Nome de usuário</span></label>
                    <input id="username" name="username" type="text" placeholder="Digite seu usuário" class="input w-full" autocomplete="username" required/>
                </div>
                <div>
                    <label for="email" class="label mb-1"><span class="label-text font-semibold">E-mail</span></label>
                    <input id="email" name="email" type="email" placeholder="seu@email.com" class="input w-full" autocomplete="email" required/>
                </div>
                <div>
                    <label for="password" class="label mb-1"><span class="label-text font-semibold">Senha</span></label>
                    <input id="password" name="password" type="password" placeholder="Crie uma senha" class="input w-full" autocomplete="new-password" required/>
                </div>
                <button type="submit" class="btn btn-primary w-full">Criar minha conta</button>
            </form>
            <div class="divider">OU</div>
            <p class="text-center text-sm">Já tem uma conta? <a href="{% url 'account:login' %}" class="link link-primary font-semibold">Fazer login</a></p>
        </div>
    </main>
</body>
</html>
