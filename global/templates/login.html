
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login</title>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center p-4">
    <main class="card w-full max-w-md bg-base-100 shadow-2xl">
        <div class="card-body p-8 sm:p-10">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold">Bem-vindo de volta</h1>
                <p class="text-base-content/60 mt-2">Entre na sua conta para continuar.</p>
            </div>
            <form action="{% url 'account:login' %}" method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label for="username" class="label mb-1"><span class="label-text font-semibold">Usuário ou e-mail</span></label>
                    <input id="username" name="username" type="text" placeholder="seu@email.com" class="input w-full" autocomplete="username" required/>
                </div>
                <div>
                    <label for="password" class="label mb-1"><span class="label-text font-semibold">Senha</span></label>
                    <input id="password" name="password" type="password" placeholder="Digite sua senha" class="input w-full" autocomplete="current-password" required/>
                </div>
                
                <div class="flex justify-between items-center">
                    <label class="flex items-center gap-2 cursor-pointer"><input name="remember" type="checkbox" class="checkbox checkbox-primary checkbox-sm"/>Lembrar de mim</label>
                    <a href="#" class="link link-primary text-sm">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn btn-primary w-full">Entrar na conta</button>
            </form>
            <div class="divider">OU</div>
            <p class="text-center text-sm">Ainda não tem uma conta? <a href="{% url 'account:register' %}" class="link link-primary font-semibold">Criar conta</a></p>
        </div>
    </main>
</body>
</html>
